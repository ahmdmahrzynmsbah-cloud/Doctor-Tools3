<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2180B2" />
      <stop offset="50%" stop-color="#1B6A94" />
      <stop offset="100%" stop-color="#0F425E" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2F1F8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#072233" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Soft Accent Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6" />

  <!-- Central Symbol Group -->
  <g filter="url(#dropGlow)" transform="translate(0, -6)">
    <!-- Medical Cross with Rounded Edges -->
    <path d="M 216 112 C 216 103.16 223.16 96 232 96 L 280 96 C 288.84 96 296 103.16 296 112 L 296 200 L 384 200 C 392.84 200 400 207.16 400 216 L 400 264 C 400 272.84 392.84 280 384 280 L 296 280 L 296 368 C 296 376.84 288.84 384 280 384 L 232 384 C 223.16 384 216 376.84 216 368 L 216 280 L 128 280 C 119.16 280 112 272.84 112 264 L 112 216 C 112 207.16 119.16 200 128 200 L 216 200 Z" fill="url(#crossGrad)" />

    <!-- Pulse ECG Line (Doctor / Health Motif) -->
    <path d="M 148 240 L 200 240 L 224 186 L 256 294 L 288 214 L 312 240 L 364 240" fill="none" stroke="#2180B2" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Pulse Highlight Node -->
    <circle cx="256" cy="294" r="7" fill="#0EA5E9" />
  </g>

  <!-- Bottom Brand Sub-text "DOCTOR TOOLS" -->
  <g transform="translate(256, 442)">
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#FFFFFF">DOCTOR TOOLS</text>
  </g>
</svg>
